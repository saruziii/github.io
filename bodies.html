<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Photo</title>


<style>


html,
body{

  margin:0;

  padding:0;

  width:100%;

  height:100%;

  background:white;

  overflow:hidden;

}


/* =========================
   VIEWPORT
========================= */

#viewport{

  position:fixed;

  top:0;

  left:0;

  width:100vw;

  height:100vh;

  overflow:hidden;

  touch-action:none;

}


/* =========================
   CANVAS
========================= */

#canvas{

  width:4000px;

  height:3000px;

  position:absolute;

  left:0;

  top:0;

  transform-origin:0 0;

}


/* =========================
   IMAGES
========================= */

.drag{

  position:absolute;

  cursor:grab;

  user-select:none;

  -webkit-user-select:none;

  -webkit-user-drag:none;

  -webkit-touch-callout:none;

  touch-action:none;

}


.drag:active{

  cursor:grabbing;

}


/* =========================
   OVERLAY
========================= */

#overlay {

  position: fixed;

  inset: 0;

  width: 100vw;
  height: 100vh;

  background: rgba(0,0,0,0.88);

  display: none;

  z-index: 9998;

}

#overlay.active {

  display: block;

}

/* =========================
   IMAGE ZOOM
========================= */

/* =========================
   FULL IMAGE VIEW
========================= */

.fullscreen-image {

  position: fixed !important;

  top: 50% !important;
  left: 50% !important;

  width: auto !important;
  height: auto !important;

  max-width: 90vw !important;
  max-height: 90vh !important;

  transform:
    translate(-50%, -50%) !important;

  object-fit: contain;

  z-index: 10000 !important;

  margin: 0 !important;

  pointer-events: none;

  box-shadow:
    0 20px 80px rgba(0,0,0,0.45);

}

</style>

</head>


<body>


<div id="viewport">


  <div id="canvas">


    <img
      class="drag"
      src="DSC_0398.JPG"
      width="220"
      alt=""
    >


    <img
      class="drag"
      src="DSC_0582.JPG"
      width="220"
      alt=""
    >


    <img
      class="drag"
      src="DSC_0471.JPG"
      width="220"
      alt=""
    >


    <img
      class="drag"
      src="DSC_0228.JPG"
      width="220"
      alt=""
    >


    <img
      class="drag"
      src="imp_0553.JPG"
      width="220"
      alt=""
    >


    <img
      class="drag"
      src="imp_0320.JPG"
      width="220"
      alt=""
    >


    <img
      class="drag"
      src="DSC_1015.JPG"
      width="220"
      alt=""
    >


    <img
      class="drag"
      src="DSC_0992.JPG"
      width="220"
      alt=""
    >


    <img
      class="drag"
      src="アートボード 25.png"
      width="220"
      alt=""
    >


    <img
      class="drag"
      src="DSC_0439.JPG"
      width="220"
      alt=""
    >


    <img
      class="drag"
      src="DSC_0237.JPG"
      width="220"
      alt=""
    >


  </div>

</div>


<div id="overlay"></div>


<script>


/* =========================
   ELEMENTS
========================= */

const viewport =
  document.getElementById("viewport");


const canvas =
  document.getElementById("canvas");


const images =
  document.querySelectorAll(".drag");


const overlay =
  document.getElementById("overlay");


/* =========================
   STORAGE
========================= */

const storageKey =
  "alreadythere_positions";


const savedPositions =
  JSON.parse(
    localStorage.getItem(storageKey)
  );


/* =========================
   INITIAL POSITIONS
========================= */

if(!savedPositions){

  images.forEach((img)=>{

    img.style.left =
      Math.floor(
        Math.random()*3200+100
      ) + "px";


    img.style.top =
      Math.floor(
        Math.random()*2400+100
      ) + "px";

  });

}


/* =========================
   RESTORE POSITIONS
========================= */

if(savedPositions){

  images.forEach(
    (img,index)=>{

      if(savedPositions[index]){

        img.style.left =
          savedPositions[index].left;


        img.style.top =
          savedPositions[index].top;

      }

    }
  );

}


/* =========================
   CANVAS VIEW
========================= */

let scale = 1;

let panX = 0;

let panY = 0;


function updateCanvas(){

  canvas.style.transform =
    `
      translate(
        ${panX}px,
        ${panY}px
      )
      scale(${scale})
    `;

}


/* =========================
   Z INDEX
========================= */

let highestZ = 1;


/* =========================
   SAVE POSITIONS
========================= */

function savePositions(){

  const positions = [];


  document
    .querySelectorAll(".drag")
    .forEach((img)=>{

      positions.push({

        left:
          img.style.left,

        top:
          img.style.top

      });

    });


  localStorage.setItem(

    storageKey,

    JSON.stringify(positions)

  );

}


/* =========================
   IMAGE DRAG
========================= */

images.forEach((img)=>{

  let isDragging = false;

  let pointerId = null;

  let offsetX = 0;

  let offsetY = 0;


  img.addEventListener(
    "pointerdown",
    (e)=>{

      e.preventDefault();

      e.stopPropagation();


      pointerId =
        e.pointerId;


      img.setPointerCapture(
        pointerId
      );


      isDragging = true;


      const rect =
        canvas.getBoundingClientRect();


      const x =
        (
          e.clientX -
          rect.left
        ) / scale;


      const y =
        (
          e.clientY -
          rect.top
        ) / scale;


      offsetX =
        x -
        img.offsetLeft;


      offsetY =
        y -
        img.offsetTop;


      highestZ++;


      img.style.zIndex =
        highestZ;

    }
  );


  img.addEventListener(
    "pointermove",
    (e)=>{

      if(!isDragging)
        return;


      if(
        e.pointerId !==
        pointerId
      )
        return;


      const rect =
        canvas.getBoundingClientRect();


      const x =
        (
          e.clientX -
          rect.left
        ) / scale;


      const y =
        (
          e.clientY -
          rect.top
        ) / scale;


      img.style.left =
        (
          x -
          offsetX
        ) + "px";


      img.style.top =
        (
          y -
          offsetY
        ) + "px";

    }
  );


  img.addEventListener(
    "pointerup",
    (e)=>{

      if(
        e.pointerId !==
        pointerId
      )
        return;


      isDragging = false;


      savePositions();

    }
  );


  img.addEventListener(
    "pointercancel",
    ()=>{

      isDragging = false;

    }
  );


  /* =====================
     DOUBLE TAP / CLICK
  ===================== */

  /* =========================
   DOUBLE CLICK / TAP
========================= */

img.addEventListener(
  "dblclick",
  (e) => {

    e.preventDefault();

    e.stopPropagation();


    /* すでに表示されていたら終了 */

    if (
      document.querySelector(
        ".fullscreen-image"
      )
    ) {

      return;

    }


    /* =====================
       BACKGROUND
    ===================== */

    overlay.classList.add(
      "active"
    );


    /* =====================
       COPY IMAGE
    ===================== */

    const fullImage =
      img.cloneNode(true);


    fullImage.classList.remove(
      "drag"
    );


    fullImage.classList.add(
      "fullscreen-image"
    );


    /*
      canvasの外、
      body直下に置く
    */

    document.body.appendChild(
      fullImage
    );


    /*
      画像が読み込まれた後に
      中央配置
    */

    if (fullImage.complete) {

      centerFullImage(
        fullImage
      );

    } else {

      fullImage.onload = () => {

        centerFullImage(
          fullImage
        );

      };

    }

  }
);


/* =========================
   PAN + PINCH
========================= */

let pointers =
  new Map();


let isPanning =
  false;


let panStartX = 0;

let panStartY = 0;

let panStartPanX = 0;

let panStartPanY = 0;


let pinchStartDistance =
  0;


let pinchStartScale =
  1;


let pinchCenterX =
  0;


let pinchCenterY =
  0;


/* =========================
   POINTER DOWN
========================= */

viewport.addEventListener(
  "pointerdown",
  (e)=>{

    /*
      写真を触った場合は
      写真のドラッグを優先
    */

    if(
      e.target.classList.contains(
        "drag"
      )
    ){

      return;

    }


    pointers.set(

      e.pointerId,

      {
        x:e.clientX,
        y:e.clientY
      }

    );


    /* =====================
       1本指 PAN
    ===================== */

    if(
      pointers.size === 1
    ){

      isPanning = true;


      panStartX =
        e.clientX;


      panStartY =
        e.clientY;


      panStartPanX =
        panX;


      panStartPanY =
        panY;

    }


    /* =====================
       2本指 PINCH
    ===================== */

    if(
      pointers.size === 2
    ){

      isPanning = false;


      const pts =
        [
          ...pointers.values()
        ];


      pinchStartDistance =
        Math.hypot(

          pts[0].x -
          pts[1].x,

          pts[0].y -
          pts[1].y

        );


      pinchStartScale =
        scale;


      pinchCenterX =
        (
          pts[0].x +
          pts[1].x
        ) / 2;


      pinchCenterY =
        (
          pts[0].y +
          pts[1].y
        ) / 2;

    }

  }
);


/* =========================
   POINTER MOVE
========================= */

viewport.addEventListener(
  "pointermove",
  (e)=>{

    if(
      !pointers.has(
        e.pointerId
      )
    ){

      return;

    }


    pointers.set(

      e.pointerId,

      {
        x:e.clientX,
        y:e.clientY
      }

    );


    /* =====================
       1本指 PAN
    ===================== */

    if(
      pointers.size === 1 &&
      isPanning
    ){

      panX =
        panStartPanX +
        (
          e.clientX -
          panStartX
        );


      panY =
        panStartPanY +
        (
          e.clientY -
          panStartY
        );


      updateCanvas();


      return;

    }


    /* =====================
       2本指 PINCH
    ===================== */

    if(
      pointers.size === 2
    ){

      const pts =
        [
          ...pointers.values()
        ];


      const distance =
        Math.hypot(

          pts[0].x -
          pts[1].x,

          pts[0].y -
          pts[1].y

        );


      let newScale =
        pinchStartScale *
        (
          distance /
          pinchStartDistance
        );


      newScale =
        Math.max(
          0.3,
          Math.min(
            4,
            newScale
          )
        );


      /*
        指の中心を基準に
        ズーム
      */

      const worldX =
        (
          pinchCenterX -
          panX
        ) / scale;


      const worldY =
        (
          pinchCenterY -
          panY
        ) / scale;


      scale =
        newScale;


      panX =
        pinchCenterX -
        worldX *
        scale;


      panY =
        pinchCenterY -
        worldY *
        scale;


      updateCanvas();

    }

  }
);


/* =========================
   POINTER UP
========================= */

viewport.addEventListener(
  "pointerup",
  (e)=>{

    pointers.delete(
      e.pointerId
    );


    if(
      pointers.size === 0
    ){

      isPanning = false;

    }


    /*
      2本指から1本指へ
    */

    if(
      pointers.size === 1
    ){

      const remaining =
        [
          ...pointers.values()
        ][0];


      isPanning = true;


      panStartX =
        remaining.x;


      panStartY =
        remaining.y;


      panStartPanX =
        panX;


      panStartPanY =
        panY;

    }

  }
);


/* =========================
   POINTER CANCEL
========================= */

viewport.addEventListener(
  "pointercancel",
  (e)=>{

    pointers.delete(
      e.pointerId
    );


    if(
      pointers.size === 0
    ){

      isPanning = false;

    }

  }
);


/* =========================
   PC WHEEL ZOOM
========================= */

viewport.addEventListener(
  "wheel",
  (e)=>{

    e.preventDefault();


    const rect =
      viewport.getBoundingClientRect();


    const mouseX =
      e.clientX -
      rect.left;


    const mouseY =
      e.clientY -
      rect.top;


    const worldX =
      (
        mouseX -
        panX
      ) / scale;


    const worldY =
      (
        mouseY -
        panY
      ) / scale;


    const zoom =
      e.deltaY < 0
        ? 1.1
        : 0.9;


    scale *= zoom;


    scale =
      Math.max(
        0.3,
        Math.min(
          4,
          scale
        )
      );


    panX =
      mouseX -
      worldX *
      scale;


    panY =
      mouseY -
      worldY *
      scale;


    updateCanvas();

  },
  {
    passive:false
  }
);


/* =========================
   CLOSE IMAGE
========================= */

overlay.addEventListener(
  "click",
  ()=>{

    overlay.classList.remove(
      "active"
    );


    images.forEach(
      (img)=>{

        img.classList.remove(
          "zoomed"
        );

      }
    );

  }
);


/* =========================
   START
========================= */

updateCanvas();


</script>


</body>

</html>
