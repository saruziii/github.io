<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>blueprints</title>

<style>

html,
body {

  margin: 0;
  padding: 0;

  background: white;

  overflow: hidden;

  width: 100%;
  height: 100%;

}


/* =========================
   VIEWPORT
========================= */

#viewport {

  width: 100vw;
  height: 100vh;

  overflow: hidden;

  position: relative;

  touch-action: none;

}


/* =========================
   CANVAS
========================= */

#canvas {

  width: 4000px;
  height: 3000px;

  position: absolute;

  left: 0;
  top: 0;

  transform-origin: 0 0;

}


/* =========================
   IMAGES
========================= */

.drag {

  position: absolute;

  cursor: grab;

  user-select: none;

  -webkit-user-select: none;

  -webkit-user-drag: none;

  -webkit-touch-callout: none;

  touch-action: none;

}


.drag:active {

  cursor: grabbing;

}


/* =========================
   OVERLAY
========================= */

#overlay {

  position: fixed;

  top: 0;
  left: 0;

  width: 100vw;
  height: 100vh;

  background: rgba(0,0,0,0.75);

  display: none;

  z-index: 9998;

}


#overlay.active {

  display: block;

}


/* =========================
   ZOOM IMAGE
========================= */

.zoomed {

  position: fixed !important;

  top: 50% !important;

  left: 50% !important;

  transform:
    translate(-50%, -50%);

  max-width: 80vw !important;

  max-height: 80vh !important;

  width: auto !important;

  height: auto !important;

  z-index: 9999 !important;

}

</style>

</head>


<body>


<div id="viewport">

  <div id="canvas">


    <img
      class="drag"
      src="DSC_11.jpeg"
      width="180"
      alt=""
    >

    <img
      class="drag"
      src="DSC_0367.JPG"
      width="180"
      alt=""
    >

    <img
      class="drag"
      src="DSC_1141.JPG"
      width="180"
      alt=""
    >

    <img
      class="drag"
      src="DSC_0664.JPG"
      width="180"
      alt=""
    >

    <img
      class="drag"
      src="DSC_0652.JPG"
      width="180"
      alt=""
    >

    <img
      class="drag"
      src="DSC_0198.JPG"
      width="180"
      alt=""
    >

    <img
      class="drag"
      src="案内板.jpg"
      width="180"
      alt=""
    >

    <img
      class="drag"
      src="2.JPG"
      width="180"
      alt=""
    >

    <img
      class="drag"
      src="DSC_0480.JPG"
      width="180"
      alt=""
    >

    <img
      class="drag"
      src="DSC_11.JPG"
      width="180"
      alt=""
    >

    <img
      class="drag"
      src="DSC_1092"
      width="180"
      alt=""
    >

    <img
      class="drag"
      src="DSC_1"
      width="180"
      alt=""
    >

    <img
      class="drag"
      src="DSC_10"
      width="180"
      alt=""
    >

  </div>

</div>


<div id="overlay"></div>


<script>


/* =========================
   ELEMENTS
========================= */

const viewport =
  document.getElementById("viewport");

const canvas =
  document.getElementById("canvas");

const images =
  document.querySelectorAll(".drag");

const overlay =
  document.getElementById("overlay");


/* =========================
   STORAGE
========================= */

const storageKey =
  "alreadythere_blueprints_positions";


const savedPositions =
  JSON.parse(
    localStorage.getItem(storageKey)
  );


/* =========================
   INITIAL POSITIONS
========================= */

if (!savedPositions) {

  images.forEach((img) => {

    img.style.left =
      Math.floor(
        Math.random() * 3200 + 100
      ) + "px";

    img.style.top =
      Math.floor(
        Math.random() * 2400 + 100
      ) + "px";

  });

}


/* =========================
   RESTORE POSITIONS
========================= */

if (savedPositions) {

  images.forEach((img, index) => {

    if (savedPositions[index]) {

      img.style.left =
        savedPositions[index].left;

      img.style.top =
        savedPositions[index].top;

    }

  });

}


/* =========================
   CANVAS VIEW
========================= */

let scale = 1;

let panX = 0;

let panY = 0;


function updateCanvas() {

  canvas.style.transform =
    `translate(${panX}px, ${panY}px) scale(${scale})`;

}


/* =========================
   Z INDEX
========================= */

let highestZ = 1;


/* =========================
   IMAGE DRAG
========================= */

images.forEach((img) => {

  let dragging = false;

  let pointerId = null;

  let offsetX = 0;

  let offsetY = 0;


  img.addEventListener(
    "pointerdown",
    (e) => {

      e.preventDefault();

      e.stopPropagation();

      pointerId = e.pointerId;

      img.setPointerCapture(pointerId);

      dragging = true;


      const rect =
        canvas.getBoundingClientRect();


      const x =
        (e.clientX - rect.left)
        / scale;

      const y =
        (e.clientY - rect.top)
        / scale;


      offsetX =
        x - img.offsetLeft;

      offsetY =
        y - img.offsetTop;


      highestZ++;

      img.style.zIndex =
        highestZ;

    }
  );


  img.addEventListener(
    "pointermove",
    (e) => {

      if (!dragging) return;

      if (e.pointerId !== pointerId)
        return;


      const rect =
        canvas.getBoundingClientRect();


      const x =
        (e.clientX - rect.left)
        / scale;

      const y =
        (e.clientY - rect.top)
        / scale;


      img.style.left =
        (x - offsetX) + "px";

      img.style.top =
        (y - offsetY) + "px";

    }
  );


  img.addEventListener(
    "pointerup",
    (e) => {

      if (e.pointerId !== pointerId)
        return;


      dragging = false;


      savePositions();

    }
  );


  img.addEventListener(
    "pointercancel",
    () => {

      dragging = false;

    }
  );


  /* DOUBLE CLICK / TAP */

  img.addEventListener(
    "dblclick",
    (e) => {

      e.stopPropagation();

      img.classList.toggle("zoomed");

      if (
        img.classList.contains("zoomed")
      ) {

        overlay.classList.add("active");

      } else {

        overlay.classList.remove("active");

      }

    }
  );

});


/* =========================
   SAVE
========================= */

function savePositions() {

  const positions = [];

  document
    .querySelectorAll(".drag")
    .forEach((image) => {

      positions.push({

        left:
          image.style.left,

        top:
          image.style.top

      });

    });


  localStorage.setItem(

    storageKey,

    JSON.stringify(positions)

  );

}


/* =========================
   MOBILE PINCH
========================= */

let pointers = new Map();

let pinchStartDistance = 0;

let pinchStartScale = 1;

let pinchCenterX = 0;

let pinchCenterY = 0;


viewport.addEventListener(
  "pointerdown",
  (e) => {

    if (e.target.classList.contains("drag"))
      return;


    pointers.set(
      e.pointerId,
      {
        x: e.clientX,
        y: e.clientY
      }
    );


    if (pointers.size === 2) {

      const pts =
        [...pointers.values()];


      pinchStartDistance =
        Math.hypot(

          pts[0].x - pts[1].x,

          pts[0].y - pts[1].y

        );


      pinchStartScale =
        scale;


      pinchCenterX =
        (pts[0].x + pts[1].x) / 2;


      pinchCenterY =
        (pts[0].y + pts[1].y) / 2;

    }

  }
);


/* =========================
   PINCH MOVE
========================= */

viewport.addEventListener(
  "pointermove",
  (e) => {

    if (!pointers.has(e.pointerId))
      return;


    pointers.set(

      e.pointerId,

      {
        x: e.clientX,
        y: e.clientY
      }

    );


    if (pointers.size !== 2)
      return;


    const pts =
      [...pointers.values()];


    const distance =
      Math.hypot(

        pts[0].x - pts[1].x,

        pts[0].y - pts[1].y

      );


    let newScale =
      pinchStartScale *
      (distance / pinchStartDistance);


    newScale =
      Math.max(
        0.3,
        Math.min(4, newScale)
      );


    /*
       Zoom around pinch center
    */

    const worldX =
      (pinchCenterX - panX)
      / scale;

    const worldY =
      (pinchCenterY - panY)
      / scale;


    scale =
      newScale;


    panX =
      pinchCenterX -
      worldX * scale;

    panY =
      pinchCenterY -
      worldY * scale;


    updateCanvas();

  }
);


/* =========================
   POINTER UP
========================= */

viewport.addEventListener(
  "pointerup",
  (e) => {

    pointers.delete(
      e.pointerId
    );

  }
);


viewport.addEventListener(
  "pointercancel",
  (e) => {

    pointers.delete(
      e.pointerId
    );

  }
);


/* =========================
   PC MOUSE WHEEL ZOOM
========================= */

viewport.addEventListener(
  "wheel",
  (e) => {

    e.preventDefault();


    const rect =
      viewport.getBoundingClientRect();


    const mouseX =
      e.clientX - rect.left;

    const mouseY =
      e.clientY - rect.top;


    const worldX =
      (mouseX - panX)
      / scale;

    const worldY =
      (mouseY - panY)
      / scale;


    const zoom =
      e.deltaY < 0
        ? 1.1
        : 0.9;


    scale *= zoom;


    scale =
      Math.max(
        0.3,
        Math.min(4, scale)
      );


    panX =
      mouseX -
      worldX * scale;

    panY =
      mouseY -
      worldY * scale;


    updateCanvas();

  },
  { passive: false }
);


/* =========================
   CLOSE IMAGE
========================= */

overlay.addEventListener(
  "click",
  () => {

    overlay.classList.remove(
      "active"
    );


    images.forEach((img) => {

      img.classList.remove(
        "zoomed"
      );

    });

  }
);


/* =========================
   START
========================= */

updateCanvas();


</script>


</body>

</html>
