<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>blueprints</title>

<style>

html,
body {
  margin: 0;
  padding: 0;
  background: white;
  overflow: auto;
}


/* CANVAS */

#canvas {
  width: 4000px;
  height: 3000px;
  position: relative;
  touch-action: none;
}


/* IMAGES */

.drag {
  position: absolute;

  cursor: grab;

  user-select: none;

  touch-action: none;

  -webkit-user-drag: none;

  -webkit-touch-callout: none;
}

.drag:active {
  cursor: grabbing;
}


/* OVERLAY */

#overlay {

  position: fixed;

  top: 0;
  left: 0;

  width: 100vw;
  height: 100vh;

  background: rgba(0,0,0,0.75);

  display: none;

  z-index: 9998;
}

#overlay.active {
  display: block;
}


/* ZOOM */

.zoomed {

  position: fixed !important;

  top: 50% !important;

  left: 50% !important;

  transform: translate(-50%, -50%);

  max-width: 80vw !important;

  max-height: 80vh !important;

  width: auto !important;

  height: auto !important;

  z-index: 9999 !important;
}

</style>

</head>


<body>


<div id="overlay"></div>


<div id="canvas">


 <img class="drag"src="DSC_11.jpeg" width="180"alt="">
 <img class="drag"src="DSC_0367.JPG" width="180"alt="">
 <img class="drag"src="DSC_1141.JPG" width="180"alt="">
 <img class="drag"src="DSC_0664.JPG" width="180"alt="">
 <img class="drag"src="DSC_0652.JPG" width="180"alt="">
 <img class="drag"src="DSC_0198.JPG" width="180"alt="">
 <img class="drag"src="案内板.jpg" width="180"alt="">
 <img class="drag"src="2.JPG" width="180"alt="">
 <img class="drag"src="DSC_0480.JPG" width="180"alt="">
 <img class="drag"src=DSC_11.JPG" width="180"alt="">
 <img class="drag"src="DSC_1092" width="180"alt="">
 <img class="drag"src="DSC_1" width="180"alt="">
 <img class="drag"src="DSC_10" width="180"alt="">




</div>


<script>


/* =========================
   IMAGE
========================= */

const images =
  document.querySelectorAll(".drag");


const overlay =
  document.getElementById("overlay");


/* =========================
   STORAGE
========================= */

const storageKey =
  "alreadythere_blueprints_positions";


const savedPositions =
  JSON.parse(
    localStorage.getItem(storageKey)
  );


/* =========================
   FIRST POSITION
========================= */

if (!savedPositions) {

  images.forEach((img) => {

    img.style.left =
      Math.floor(
        Math.random() * 3200 + 100
      ) + "px";

    img.style.top =
      Math.floor(
        Math.random() * 2400 + 100
      ) + "px";

  });

}


/* =========================
   RESTORE POSITION
========================= */

if (savedPositions) {

  images.forEach((img, index) => {

    if (savedPositions[index]) {

      img.style.left =
        savedPositions[index].left;

      img.style.top =
        savedPositions[index].top;

    }

  });

}


/* =========================
   Z INDEX
========================= */

let highestZ = 1;


/* =========================
   DRAG
========================= */

images.forEach((img) => {

  let isDragging = false;

  let offsetX = 0;

  let offsetY = 0;


  function startDrag(x, y) {

    isDragging = true;


    offsetX =
      x - img.offsetLeft;

    offsetY =
      y - img.offsetTop;


    highestZ++;

    img.style.zIndex =
      highestZ;

  }


  function moveDrag(x, y) {

    if (!isDragging) return;


    img.style.left =
      (x - offsetX) + "px";

    img.style.top =
      (y - offsetY) + "px";

  }


  function stopDrag() {

    if (!isDragging) return;


    isDragging = false;


    const positions = [];


    document
      .querySelectorAll(".drag")
      .forEach((image) => {

        positions.push({

          left:
            image.style.left,

          top:
            image.style.top

        });

      });


    localStorage.setItem(

      storageKey,

      JSON.stringify(positions)

    );

  }


  /* TOUCH / MOUSE */

  img.addEventListener(
    "pointerdown",
    (e) => {

      e.preventDefault();


      startDrag(

        e.clientX,

        e.clientY

      );

    }
  );


  document.addEventListener(

    "pointermove",

    (e) => {

      moveDrag(

        e.clientX,

        e.clientY

      );

    }

  );


  document.addEventListener(

    "pointerup",

    () => {

      stopDrag();

    }

  );


  /* =========================
     DOUBLE CLICK / TAP
  ========================= */

  img.addEventListener(

    "dblclick",

    () => {

      img.classList.toggle(
        "zoomed"
      );


      if (
        img.classList.contains(
          "zoomed"
        )
      ) {

        overlay.classList.add(
          "active"
        );

      } else {

        overlay.classList.remove(
          "active"
        );

      }

    }

  );

});


/* =========================
   CLOSE IMAGE
========================= */

overlay.addEventListener(

  "click",

  () => {

    overlay.classList.remove(
      "active"
    );


    document
      .querySelectorAll(".drag")
      .forEach((img) => {

        img.classList.remove(
          "zoomed"
        );

      });

  }

);

</script>


</body>

</html>
